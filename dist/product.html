<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тут будет лендинг</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#fff;color:#172b4d;font-family:Inter,"Helvetica Neue",Arial,sans-serif}
    main{padding:48px clamp(24px,6vw,96px);padding-right:80px}
    h1{margin:0;font-size:clamp(24px,3vw,36px);font-weight:600;letter-spacing:-.025em}
    .close-landing{position:absolute;top:24px;right:24px;width:40px;height:40px;display:grid;place-items:center;color:#71809b;border-radius:8px}
    .close-landing:hover{background:#f0f5fc;color:#075cff}
    .close-landing:focus-visible{outline:3px solid #94b9ff;outline-offset:3px}
    .close-landing::before,.close-landing::after{content:"";position:absolute;width:22px;height:2px;background:currentColor;transform:rotate(45deg)}
    .close-landing::after{transform:rotate(-45deg)}
  </style>
</head>
<body>
  <a class="close-landing" href="index.html" aria-label="Закрыть и вернуться к продуктам и услугам" title="Закрыть"></a>
  <main><h1>Тут будет лендинг</h1></main>
</body>
</html>
