<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Идея для роста</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#182235;font-family:Inter,"Helvetica Neue",Arial,sans-serif}.article-shell{min-height:100vh;padding:54px 24px}.article{position:relative;max-width:820px;margin:auto;padding:54px 64px 70px;border:1px solid #e0e6f0;border-radius:24px;background:#fff}.close{position:absolute;top:22px;right:22px;width:38px;height:38px;border:1px solid #dbe2ee;border-radius:50%;background:#fff;font-size:25px;line-height:1;cursor:pointer}.eyebrow{color:#1261df;font-size:13px;font-weight:700}.article h1{max-width:650px;margin:12px 0 18px;font-size:38px;line-height:1.12;letter-spacing:-.03em}.lead{font-size:18px;line-height:1.55;color:#5b6880}.article h2{margin:34px 0 12px;font-size:21px}.article p,.article li{font-size:15px;line-height:1.65;color:#3e4b61}.article ul{padding-left:20px}.steps{display:grid;gap:10px;margin-top:16px}.steps span{padding:14px 16px;border-radius:12px;background:#f2f6fc;color:#334158;font-size:14px}.back{display:inline-block;margin-top:34px;color:#0b5bea;text-decoration:none;font-weight:700}@media(max-width:650px){.article-shell{padding:12px}.article{padding:52px 24px}.article h1{font-size:29px}}
  </style>
</head>
<body>
  <main class="article-shell"><article class="article"><button class="close" type="button" aria-label="Закрыть">×</button><div class="eyebrow">Идея для роста</div><h1 id="title"></h1><p class="lead" id="lead"></p><div id="content"></div><a class="back" href="index.html">← Вернуться к продуктам и услугам</a></article></main>
  <script>
    const articles={
      automation:{title:'Автоматизируйте рутину до найма новых людей',lead:'Начните не с выбора сервиса, а с поиска повторяющихся действий, которые отнимают время команды каждую неделю.',html:'<h2>С чего начать</h2><p>Соберите список регулярных операций: подготовка счетов, сверка оплат, перенос данных между системами, формирование отчётов и распределение обращений. Оцените частоту, длительность и цену ошибки.</p><div class="steps"><span>1. Выберите один частый и предсказуемый процесс</span><span>2. Зафиксируйте текущие время и количество ошибок</span><span>3. Запустите пилот на небольшой группе</span><span>4. Сравните результат через четыре недели</span></div><h2>Как оценить эффект</h2><p>Считайте не только сэкономленные часы. Важны скорость ответа клиенту, снижение числа возвратов и возможность команды заниматься задачами, которые действительно требуют экспертизы.</p>'},
      financing:{title:'Выберите финансирование под задачу роста',lead:'Один финансовый инструмент не может одинаково хорошо закрывать кассовый разрыв, покупку оборудования и запуск нового направления.',html:'<h2>Свяжите срок и цель</h2><p>Короткие потребности логичнее закрывать оборотным финансированием. Инвестиции с длительной окупаемостью требуют более длинного горизонта и запаса по платежам.</p><ul><li>Составьте прогноз поступлений и обязательных расходов.</li><li>Проверьте сценарий снижения выручки.</li><li>Оставьте резерв на запуск и первые месяцы работы.</li></ul><h2>Главный ориентир</h2><p>Платёж должен оставаться посильным не только в оптимистичном сценарии. Сравнивайте полную стоимость, срок, обеспечение и гибкость досрочного погашения.</p>'},
      marketplace:{title:'Выходите на маркетплейсы через тестовую матрицу',lead:'Небольшой запуск помогает проверить спрос и экономику товара до того, как деньги окажутся заморожены в большом запасе.',html:'<h2>Соберите первую матрицу</h2><p>Выберите несколько товаров с понятной маржой, стабильной поставкой и простой упаковкой. Для каждого заранее посчитайте комиссию площадки, логистику, хранение, возвраты и продвижение.</p><div class="steps"><span>Проверьте 5–10 позиций</span><span>Сравните две модели доставки</span><span>Оцените конверсию и возвраты</span><span>Расширяйте только успешные позиции</span></div><h2>Не путайте оборот с прибылью</h2><p>Высокие продажи не гарантируют положительную экономику. Решение о масштабировании принимайте по прибыли на единицу и скорости оборачиваемости.</p>'},
      regulation:{title:'Соберите календарь обязательных изменений',lead:'Регуляторные нововведения проще внедрять, когда у каждой задачи заранее есть срок, владелец и понятный результат.',html:'<h2>Единый список</h2><p>Сведите в один календарь изменения форматов отчётности, маркировки, электронного документооборота, требований к кассам и правилам работы с персональными данными.</p><ul><li>Назначьте ответственного за каждое изменение.</li><li>Заложите время на настройку и тестирование.</li><li>Проверьте готовность подрядчиков и внутренних систем.</li><li>Зафиксируйте резервный сценарий.</li></ul><h2>Проверяйте влияние на клиента</h2><p>Даже внутреннее изменение может затронуть оплату, документы или сроки обслуживания. Предупредите клиентов заранее и подготовьте короткие инструкции для сотрудников.</p>'},
      retention:{title:'Растите за счёт повторных продаж',lead:'Удержание начинается с понимания момента, когда клиенту снова становится нужен ваш продукт или помощь.',html:'<h2>Разделите клиентов по поведению</h2><p>Сегментируйте базу по давности покупки, частоте обращений и среднему чеку. Для каждого сегмента определите полезный повод вернуться, а не одинаковую массовую рассылку.</p><div class="steps"><span>После покупки — помощь с первым результатом</span><span>Перед повторной потребностью — своевременное напоминание</span><span>После паузы — причина вернуться без давления</span></div><h2>Что измерять</h2><p>Следите за долей повторных покупок, временем между ними и оттоком. Проверяйте изменения на небольшой части аудитории, прежде чем масштабировать коммуникацию.</p>'}
    };
    const key=new URLSearchParams(location.search).get('article')||'automation',article=articles[key]||articles.automation;
    document.title=article.title;document.querySelector('#title').textContent=article.title;document.querySelector('#lead').textContent=article.lead;document.querySelector('#content').innerHTML=article.html;
    document.querySelector('.close').addEventListener('click',()=>{location.href='index.html'});
  </script>
</body>
</html>
